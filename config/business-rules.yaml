# Human-editable business policy.
# Initial human-defined operating limits for the hackathon deployment.
currency: USD

limits:
  max_inference_spend_per_day: 5.00
  minimum_report_price: 10.00

revenue_split:
  operator_percent: 80
  contributors_percent: 20

research:
  # Live mode uses source-backed public chain data.
  # Live mode queries DefiLlama and optionally uses NEAR AI Cloud.
  mode: live
  default_chain: Near

safety:
  # Stops new orders when true. This switch does not enable payment collection.
  kill_switch: false
  payments_enabled: false
  mainnet_execution_enabled: false
  require_human_approval_for_payouts: true

payments:
  # Community sandbox quote only. Does not create a deposit address or transfer funds.
  enable_sandbox_dry_quotes: true
