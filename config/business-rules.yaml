# Human-editable business policy.
# Example values for hackathon demo use only; review before any live operation.
currency: USD

limits:
  max_inference_spend_per_day: 5.00
  minimum_report_price: 10.00

revenue_split:
  operator_percent: 80
  contributors_percent: 20

research:
  # "demo" uses clearly labelled synthetic data.
  # Set to "live" to query DefiLlama and optionally use NEAR AI Cloud.
  mode: demo
  default_chain: Near

safety:
  # Allows the local simulated research workflow. Does not authorize payments.
  kill_switch: false
  payments_enabled: false
  mainnet_execution_enabled: false
  require_human_approval_for_payouts: true
